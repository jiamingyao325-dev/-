<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../vibe-kit/ink.js"></script>
<script>
// 《半斤八两：一杆老秤》—— 全部画面由代码绘制。render(t) 画出第 t 秒的画面。
const TOP = 330, BRASS = '#b58a3a';

// ---------- 一杆秤 ----------
const BEAM = { x1: 170, x2: 920, y: 660 };
const starX = i => 330 + i * 37;                                     // 第 i 颗秤星（0..15）
function scale(t, a, k) {                                             // k：画出进度
  if (a <= 0) return;
  const { x1, x2, y } = BEAM;
  brush('beam', x1, y, x2, y, k, 16, '#3a2a1a', a);                   // 秤杆
  const hk = clamp(k * 2 - .6);
  brush('nz', 250, y - 8, 250, y - 120, hk, 3, INK, a);               // 提纽
  ctx.save(); ctx.globalAlpha = a * hk; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(250, y - 132, 12, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  brush('c1', 195, y + 6, 150, y + 150, hk, 2.5, INK, a * .8);        // 秤盘的绳
  brush('c2', 195, y + 6, 240, y + 150, hk, 2.5, INK, a * .8);
  ctx.save(); ctx.globalAlpha = a * hk; ctx.fillStyle = '#3a2a1a';
  ctx.beginPath(); ctx.ellipse(195, y + 156, 62, 14, 0, 0, Math.PI); ctx.fill(); ctx.restore();
  const wx = 700 + Math.sin(t * .8) * 6;                              // 秤砣，轻轻晃
  brush('wc', wx, y + 6, wx, y + 110, hk, 2.5, INK, a * .8);
  ctx.save(); ctx.globalAlpha = a * hk; ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(wx - 26, y + 112); ctx.lineTo(wx + 26, y + 112); ctx.lineTo(wx + 40, y + 180); ctx.lineTo(wx - 40, y + 180); ctx.closePath(); ctx.fill(); ctx.restore();
}
function stars(t, a, t0, groups) {
  if (a <= 0) return;
  for (let i = 0; i < 16; i++) {
    const k = prog(t, t0 + i * .22, t0 + .3 + i * .22);
    if (k <= 0) continue;
    let color = BRASS;
    if (groups > 0) color = i >= 13 ? RED : i >= 7 ? '#d9c08a' : BRASS;
    ctx.globalAlpha = a * k; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(starX(i), BEAM.y, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(String(i + 1), starX(i), BEAM.y - 40, { size: 22, color: MUTE, alpha: a * k * (1 - groups) });
  }
}

// ---------- 对半分 ----------
const LEVELS = [['一斤', 1], ['半斤', 2], ['四两', 4], ['二两', 8], ['一两', 16]];
function halving(t, a, t0) {
  if (a <= 0) return;
  const x0 = 290, w = 600, gap = 8;
  LEVELS.forEach(([name, parts], li) => {
    const k = prog(t, t0 + li * 1.1, t0 + .7 + li * 1.1);
    if (k <= 0) return;
    const y = 470 + li * 105, segW = (w - gap * (parts - 1)) / parts;
    for (let p = 0; p < parts; p++) {
      ctx.globalAlpha = a * k * .88; ctx.fillStyle = li === 1 ? RED : INK;
      ctx.fillRect(x0 + p * (segW + gap) * k + (1 - k) * p * segW, y - 26, segW, 52);
    }
    ctx.globalAlpha = 1;
    text(name, x0 - 30, y, { size: 40, weight: 700, align: 'right', alpha: a * k, color: li === 1 ? RED : INK });
    text(`${16 / parts} 两`, x0 + w + 24, y, { size: 30, align: 'left', alpha: a * k, color: MUTE });
  });
}

// ---------- 主时间线 ----------
scene(58, t => {
  background(t, '半斤八两', '一杆老秤');

  // ① 0–4.6s 问题
  const qa = win(t, -1, 4.6);
  richText([['半斤 = 八两', INK], [' ？', RED]], 540, 600, { size: 110, weight: 900, alpha: qa, spacing: 6 });
  caption(t, 0, 4.6, '都说「半斤八两」，|可半斤，为什么是八两？', 'Half a jin is eight liang. But why?');

  // ② 4.8–21s 老秤：十六颗星
  const sa = win(t, 4.8, 21.2);
  scale(t, sa, prog(t, 4.8, 6.4));
  stars(t, sa, 6.8, prog(t, 13, 13.8));
  text('一斤 = 十六两', 540, TOP, { size: 64, weight: 900, alpha: win(t, 7.4, 12.8), spacing: 6 });
  caption(t, 4.8, 8.8, '因为老秤上，一斤是十六两。', 'On the old steelyard, one jin was sixteen liang.');
  caption(t, 8.8, 12.8, '秤杆上的星，一颗一两，|一共十六颗。', 'One star per liang along the beam. Sixteen stars.');
  const ga = win(t, 13.2, 21.2);
  [['北斗七星', 0, 6, BRASS], ['南斗六星', 7, 12, '#b49a62'], ['福禄寿', 13, 15, RED]].forEach(([l, a, b, c], j) => {
    const k = ga * prog(t, 13.4 + j * .6, 14 + j * .6);
    text(l, (starX(a) + starX(b)) / 2, BEAM.y - 50, { size: 30, weight: 700, color: c, alpha: k });
    brush('gb' + j, starX(a) - 6, BEAM.y - 24, starX(b) + 6, BEAM.y - 24, k, 2, c, k);
  });
  caption(t, 13.2, 17.2, '传说这十六颗星，是北斗七星、|南斗六星，再加福禄寿三星。', 'Legend: the Big Dipper, the Southern Dipper, and three stars of luck.');
  text('少一两折福 · 少二两损禄 · 少三两减寿', 540, TOP, { size: 40, weight: 700, color: RED, alpha: win(t, 17.4, 21.2), spacing: 2 });
  caption(t, 17.4, 21.2, '卖东西短斤少两，|就是折自己的福、禄、寿。', 'Cheat on weight, and you cheat your own fortune.');

  // ③ 21.4–33s 为什么是十六：能一直对半分
  const ha = win(t, 21.4, 28.6);
  halving(t, ha, 21.8);
  caption(t, 21.4, 24.8, '十六有个好处：|可以一直对半分。', 'Sixteen can be halved again and again.');
  caption(t, 24.8, 28.6, '一斤、半斤、四两、二两、一两，|分到底，都是整数。', 'Down to one liang, every part is whole.');
  const ta = win(t, 28.8, 33);
  richText([['10 → 5 → ', INK], ['2.5', RED]], 540, 640, { size: 96, weight: 900, alpha: ta * prog(t, 29, 29.8) });
  caption(t, 28.8, 33, '换成十两一斤，|再对半分，就是二两半了。', 'With ten, the second halving gives two and a half.');

  // ④ 33.2–37.4s 成语的意思
  const ia = win(t, 33.2, 37.4);
  text('半斤', 360, 640, { size: 110, weight: 900, alpha: ia });
  text('=', 540, 640, { size: 90, weight: 700, color: RED, alpha: ia * prog(t, 33.8, 34.3) });
  text('八两', 720, 640, { size: 110, weight: 900, alpha: ia });
  caption(t, 33.2, 37.4, '所以「半斤八两」，说的是：|两样东西，其实一样重。', 'So "half a jin, eight liang" means: exactly the same.');

  // ⑤ 37.6–44.4s 1959 年
  const ya = win(t, 37.6, 44.4);
  text('1959', 540, 520, { size: 120, weight: 700, alpha: ya });
  text('国务院《关于统一计量制度的命令》', 540, 630, { size: 34, color: MUTE, alpha: ya, spacing: 2 });
  richText([['十六两一斤', MUTE], ['  →  ', INK], ['十两一斤', RED]], 540, 740, { size: 52, weight: 900, alpha: ya * prog(t, 38.6, 39.4), spacing: 4 });
  caption(t, 37.6, 41, '1959 年，嫌折算麻烦，|一斤改成了十两。', 'In 1959, a jin became ten liang to make sums easier.');
  caption(t, 41, 44.4, '从那以后，|半斤就是五两了。', 'Since then, half a jin is five liang.');

  // ⑥ 44.6–52s 今天
  const da = win(t, 44.6, 52);
  [['内地', '1 斤 = 10 两 = 500 克', INK], ['香港', '1 斤 = 16 两 ≈ 605 克', RED], ['台湾', '1 台斤 = 16 两 = 600 克', RED]].forEach(([p, v, c], i) => {
    const a = da * prog(t, 45 + i * .7, 45.6 + i * .7);
    text(p, 230, 520 + i * 120, { size: 48, weight: 900, alpha: a, align: 'left', color: c });
    text(v, 380, 520 + i * 120, { size: 44, weight: 700, alpha: a, align: 'left' });
  });
  caption(t, 44.6, 48.4, '可在香港、台湾，|一斤至今还是十六两。', 'In Hong Kong and Taiwan, a jin is still sixteen liang.');
  caption(t, 48.4, 52, '买菜的时候，|同样一斤，分量可不一样。', 'Same word, different weight at the market.');

  // ⑦ 52.2–58s 收尾
  const ea = prog(t, 52.2, 53);
  scale(t, ea, 1);
  stars(t, ea, -10, 1);
  text('半斤八两', 505, TOP - 20, { size: 84, weight: 900, alpha: ea, spacing: 12 });
  seal('秤星', 760, TOP - 26, 64, prog(t, 52.8, 53.4));
  caption(t, 52.2, 58.5, '秤上十六颗星，|称的是货，也是良心。', 'Sixteen stars on a beam: they weigh goods, and conscience.');
});
</script>
</body></html>
