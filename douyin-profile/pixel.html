<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="a" width="1080" height="1080"></canvas>
<canvas id="b" width="1125" height="633"></canvas>
<script>
// 像素风墨童：32×32 的像素格，逐格上色后按整数倍放大（不抗锯齿）
// 头像 1080×1080；主页背景 1125×633
const P = {
  bg: '#f1e6cf', sun: (new URLSearchParams(location.search).get('m') || 'kid') === 'kid' ? '#c8402f' : '#e9c46a', ink: '#1b1712', skin: '#f6dcc0', skin2: '#e9c3a0', cheek: '#ef8f7e',
  white: '#fffaf0', robe: '#3f6d78', robe2: '#2e525b', gold: '#e6b450', wood: '#8a5a32', red: '#b8322a',
};
const N = 32;
function sprite() {
  const g = Array.from({ length: N }, () => Array(N).fill(null));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; };
  const circle = (cx, cy, r, c, cond = () => true) => {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (Math.hypot(x + .5 - cx, y + .5 - cy) <= r && cond(x, y)) set(x, y, c);
  };
  // 身体（青色袍子，圆肩）
  for (let y = 22; y < N; y++) for (let x = 6; x < 26; x++) {
    const shoulder = y < 25 ? Math.abs(x + .5 - 16) <= 7 + (y - 22) * 1.6 : true;
    if (shoulder) set(x, y, x < 16 ? P.robe : P.robe2);
  }
  // 白色交领
  for (let y = 22; y < 27; y++) { set(15 - (y - 22), y, P.white); set(16 + (y - 22), y, P.white); }
  for (let y = 22; y < 25; y++) for (let x = 14; x < 18; x++) if (Math.abs(x + .5 - 16) < 2 - (y - 22) * .5) set(x, y, P.skin2);
  set(15, 27, P.red); set(16, 27, P.red);                               // 红绳结
  // 两个发髻 + 金色发带
  circle(9.5, 6.5, 3, P.ink); circle(22.5, 6.5, 3, P.ink);
  for (const x of [7, 8, 9, 10, 11, 12]) set(x, 9, P.gold);
  for (const x of [19, 20, 21, 22, 23, 24]) set(x, 9, P.gold);
  // 小天线（AI 的记号），顶上一颗红珠
  for (let y = 2; y < 6; y++) set(16, y, P.ink);
  set(16, 1, P.red); set(15, 1, P.red); set(16, 0, P.red); set(15, 0, P.red);
  // 头发和脸
  circle(16, 14, 8.6, P.ink);
  circle(16, 16, 6.6, P.skin, (x, y) => y >= 12);
  for (const [x, y] of [[13, 12], [14, 12], [17, 12], [18, 12], [12, 13], [19, 13]]) set(x, y, P.ink);  // 刘海锯齿
  // 眼睛（2×2，左上一点高光）
  for (const ex of [12, 19]) { set(ex, 15, P.white); set(ex + 1, 15, P.ink); set(ex, 16, P.ink); set(ex + 1, 16, P.ink); }
  // 腮红、笑
  set(11, 18, P.cheek); set(12, 18, P.cheek); set(19, 18, P.cheek); set(20, 18, P.cheek);
  set(14, 18, P.ink); set(15, 19, P.ink); set(16, 19, P.ink); set(17, 18, P.ink);
  for (let x = 13; x < 19; x++) set(x, 22, P.skin2);                   // 下巴阴影
  // 毛笔：右手斜握
  for (let i = 0; i < 12; i++) set(27 - Math.floor(i * .5), 14 + i, P.wood);
  set(27, 14, P.red); set(27, 13, P.red);
  set(21, 26, P.ink); set(21, 27, P.ink); set(20, 28, P.ink);
  set(22, 24, P.skin); set(23, 24, P.skin); set(22, 25, P.skin); set(23, 25, P.skin);   // 手
  return g;
}

// ---------- 动物方案 ----------
function grid() { const g = Array.from({ length: N }, () => Array(N).fill(null));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; };
  const circle = (cx, cy, r, c, cond = () => true) => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (Math.hypot(x + .5 - cx, y + .5 - cy) <= r && cond(x, y)) set(x, y, c); };
  const ell = (cx, cy, rx, ry, c, cond = () => true) => { for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2 <= 1 && cond(x, y)) set(x, y, c); };
  return { g, set, circle, ell }; }
// 墨鱼：粉色身子、尖顶带鳍、大眼睛、六条触手，一条握毛笔，身后一滴墨
function squid() {
  const { g, set, ell } = grid(), B = '#f2a6a0', D = '#d97f7c', L = '#fbd3cc';
  for (let y = 3; y < 9; y++) { const h = (y - 3) * .9; for (let x = 0; x < N; x++) if (Math.abs(x + .5 - 16) <= h) set(x, y, B); }  // 尖顶
  ell(16, 14, 8.5, 7.5, B);                                                                          // 身子
  for (const sx of [-1, 1]) for (let y = 7; y < 12; y++) for (let k = 0; k < 12 - y; k++) set(16 + sx * (8 + k), y + 1, D);       // 两侧鳍
  ell(13, 10, 2, 1.4, L);                                                                             // 高光
  for (let i = 0; i < 6; i++) {                                                                       // 触手
    const x0 = 9 + i * 2.6, wav = i % 2 ? 1 : -1;
    for (let y = 20; y < 29; y++) { const x = Math.round(x0 + Math.sin((y - 20) / 2.2) * wav); set(x, y, B); set(x + 1, y, y > 26 ? D : B); }
  }
  for (let x = 8; x < 25; x++) set(x, 20, D);
  for (const ex of [11, 18]) { for (let y = 12; y < 16; y++) for (let x = ex; x < ex + 3; x++) set(x, y, P.ink); set(ex, 12, P.white); set(ex + 1, 12, P.white); set(ex, 13, P.white); }
  set(10, 17, P.cheek); set(11, 17, P.cheek); set(21, 17, P.cheek); set(22, 17, P.cheek);
  set(15, 17, P.ink); set(16, 18, P.ink); set(17, 17, P.ink);
  for (let i = 0; i < 10; i++) set(26 + Math.floor(i * .3), 15 + i, P.wood);                          // 毛笔
  set(26, 14, P.red); set(26, 13, P.red); set(29, 25, P.ink); set(29, 26, P.ink); set(30, 27, P.ink);
  set(24, 22, B); set(25, 22, B); set(25, 21, B); set(26, 21, B);                                     // 触手卷住笔
  for (const [x, y] of [[4, 24], [4, 25], [5, 25], [3, 26], [4, 26], [5, 26], [4, 27]]) set(x, y, P.ink);   // 一滴墨
  return g;
}
// 狸花猫：灰褐虎斑、绿眼、红围巾、握毛笔
function cat() {
  const { g, set, circle, ell } = grid(), F = '#a8937a', S = '#5e4b3a', W = '#efe4d2', E = '#6fae5b';
  for (const sx of [-1, 1]) for (let y = 3; y < 10; y++) for (let x = 0; x < N; x++) {           // 耳朵
    const cx = 16 + sx * 7, half = (y - 3) * .6; if (Math.abs(x + .5 - cx) <= half) set(x, y, F);
    if (Math.abs(x + .5 - cx) <= half - 1.3 && y > 5) set(x, y, '#e8a59a');
  }
  ell(16, 15, 10, 8, F);                                                                           // 头
  ell(16, 26, 9, 6, F, (x, y) => y >= 22);                                                        // 身子
  ell(16, 19, 5, 3.2, W);                                                                          // 嘴边白毛
  for (const [x, y] of [[15, 8], [16, 8], [15, 9], [16, 9], [13, 9], [18, 9], [12, 10], [19, 10], [8, 14], [9, 14], [23, 14], [24, 14], [7, 16], [8, 16], [24, 16], [25, 16]]) set(x, y, S);  // 虎斑
  for (const ex of [11, 19]) { for (let y = 13; y < 16; y++) for (let x = ex; x < ex + 3; x++) set(x, y, E); for (let y = 13; y < 16; y++) set(ex + 1, y, P.ink); set(ex, 13, P.white); }
  set(15, 17, '#d9867c'); set(16, 17, '#d9867c'); set(15, 18, P.ink); set(16, 19, P.ink); set(17, 18, P.ink); set(14, 19, P.ink);
  set(10, 18, P.cheek); set(21, 18, P.cheek);
  for (let x = 8; x < 25; x++) { set(x, 22, P.red); set(x, 23, P.red); }                          // 红围巾
  set(10, 24, P.red); set(11, 24, P.red); set(10, 25, P.red); set(11, 26, P.red);
  for (const [x, y] of [[13, 26], [14, 27], [18, 26], [19, 27]]) set(x, y, S);
  for (let i = 0; i < 11; i++) set(27 - Math.floor(i * .4), 14 + i, P.wood);                      // 毛笔
  set(27, 13, P.red); set(27, 12, P.red); set(22, 25, P.ink); set(23, 25, P.ink); set(22, 26, P.ink);
  circle(24.5, 24.5, 1.6, W);                                                                      // 爪子
  return g;
}

function drawSprite(c, g, x0, y0, s) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (g[y][x]) { c.fillStyle = g[y][x]; c.fillRect(x0 + x * s, y0 + y * s, s, s); }
}
function pixelSun(c, cx, cy, r, s) {                                    // 像素太阳（背景圆）
  c.fillStyle = P.sun;
  for (let y = -r; y < r; y++) for (let x = -r; x < r; x++)
    if (Math.hypot(x + .5, y + .5) <= r) c.fillRect(cx + x * s, cy + y * s, s, s);
}
// 像素字：先在小画布上写，二值化，再整数倍放大
function pixelText(c, str, x, y, px, scale, color) {
  const t = document.createElement('canvas'), tc = t.getContext('2d');
  tc.font = `700 ${px}px "Noto Sans SC"`;
  t.width = Math.ceil(tc.measureText(str).width) + 2; t.height = px + 4;
  tc.font = `700 ${px}px "Noto Sans SC"`; tc.fillStyle = color; tc.textBaseline = 'top'; tc.fillText(str, 1, 1);
  const d = tc.getImageData(0, 0, t.width, t.height);
  for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0;
  tc.putImageData(d, 0, 0);
  c.imageSmoothingEnabled = false; c.drawImage(t, x, y, t.width * scale, t.height * scale);
}

window.ready = (async () => {
  document.fonts.add(await new FontFace('Noto Sans SC', 'url(../vibe-kit/fonts/NotoSansSC-700.ttf)', { weight: '700' }).load());
  const g = { squid, cat, kid: sprite }[new URLSearchParams(location.search).get('m') || 'kid']();
  const a = document.getElementById('a').getContext('2d');
  a.fillStyle = P.bg; a.fillRect(0, 0, 1080, 1080);
  pixelSun(a, 540, 470, 13, 32);
  drawSprite(a, g, 28, 28, 32);
  const b = document.getElementById('b').getContext('2d');
  b.fillStyle = P.bg; b.fillRect(0, 0, 1125, 633);
  pixelSun(b, 236, 300, 13, 14);
  drawSprite(b, g, 12, 92, 14);
  pixelText(b, '用代码，画中国', 470, 220, 16, 5, P.ink);
  pixelText(b, '老祖宗的学问，一格一格画给你看', 474, 345, 12, 3, P.robe2);
  return true;
})();
</script>
</body></html>
