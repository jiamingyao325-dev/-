<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../vibe-kit/ink.js"></script>
<script>
// 《六十甲子：生肖、本命年与干支》—— 全部画面由代码绘制。render(t) 画出第 t 秒的画面。
const TOP = 300;
const GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
const ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const SHENG = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
const C = { x: 540, y: 700 }, RO = 262, RI = 162;
const pair = k => GAN[((k % 10) + 10) % 10] + ZHI[((k % 12) + 12) % 12];

// 转盘走到第几步（第 0 步 = 甲子；2026 丙午 = 42，1894 甲午 = 30，1898 戊戌 = 34，1911 辛亥 = 47）
function stepAt(t) {
  if (t < 19.4) return 42;
  if (t < 21) return lerp(42, 30, prog(t, 19.4, 21));
  if (t < 23.6) return 30;
  if (t < 24.8) return lerp(30, 34, prog(t, 23.6, 24.8));
  if (t < 27.2) return 34;
  if (t < 28.4) return lerp(34, 47, prog(t, 27.2, 28.4));
  if (t < 36.6) return 47;
  return lerp(47, 102, prog(t, 36.6, 41));                              // 转满一大圈，停回丙午
}

// 一圈字：items 均匀排在半径 r 上，转到第 s 步时第 s 个在正上方；sub 是写在外侧的小字
function ring(items, r, s, a, size, drawK, sub) {
  if (a <= 0) return;
  const n = items.length, cur = ((Math.round(s) % n) + n) % n;
  ctx.save(); ctx.globalAlpha = a * .8; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(C.x, C.y, r - size * .95, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * drawK); ctx.stroke(); ctx.restore();
  items.forEach((ch, i) => {
    const k = clamp(drawK * n - i);
    if (k <= 0) return;
    const ang = -Math.PI / 2 + (i - s) * Math.PI * 2 / n, x = C.x + Math.cos(ang) * r, y = C.y + Math.sin(ang) * r;
    const on = i === cur;
    text(ch, x, y + 2, { size, weight: on ? 900 : 700, color: on ? RED : INK, alpha: a * k });
    if (sub) text(sub[i], C.x + Math.cos(ang) * (r + 44), C.y + Math.sin(ang) * (r + 44) + 1, { size: 24, color: on ? RED : MUTE, alpha: a * k });
  });
}
function pointer(a, inner) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = RED; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(C.x - 38, C.y - RO - 36, 76, 72, 12); ctx.stroke();
  if (inner > 0) { ctx.globalAlpha = a * inner; ctx.beginPath(); ctx.roundRect(C.x - 36, C.y - RI - 34, 72, 68, 12); ctx.stroke(); }
  ctx.restore();
}

// ---------- 主时间线 ----------
const render = t => {
  background(t, '六十甲子', '生肖与干支');

  const s = stepAt(t);
  const ringA = Math.max(win(t, -1, 31.4, .6), t > 36 ? prog(t, 36, 36.6) : 0);
  const innerK = t > 36 ? 1 : prog(t, 12.4, 14.2);
  ring(SHENG, RO, s, ringA, 46, t > 36 ? 1 : prog(t, 0, 2.2), ZHI);
  ring(GAN, RI, s, ringA * (t > 36 ? 1 : innerK > 0 ? 1 : 0), 42, innerK);
  pointer(ringA * (t > 36 ? 1 : prog(t, 4.2, 4.8)), innerK);

  // ① 属相与本命年
  text('你属什么？', 540, TOP, { size: 80, weight: 900, alpha: win(t, -1, 4.2), spacing: 6 });
  caption(t, 0, 4.2, '人人都有属相，|十二年一轮。', 'Everyone has a zodiac animal. Twelve years, one cycle.');
  richText([['本命年', RED], [' · 属马', INK]], 540, TOP, { size: 72, weight: 900, alpha: win(t, 4.2, 12.4), spacing: 6 });
  caption(t, 4.2, 8.4, '今年 2026 是马年，1990、2002、|2014 年出生的，都是本命年。', '2026 is the Year of the Horse: a birth-year cycle for many.');
  caption(t, 8.4, 12.4, '老人讲究：本命年要穿红、|系红腰带，图个吉利。', 'Tradition says: wear red in your animal year, for luck.');

  // ② 每一年完整的名字：干支
  text('丙午', 540, TOP, { size: 90, weight: 900, color: RED, alpha: win(t, 12.6, 16.4), spacing: 12 });
  caption(t, 12.4, 16.4, '其实每一年，还有个完整的名字：|天干配地支。今年叫「丙午」。', 'Each year has a full name, stem plus branch. 2026 is Bing-Wu.');

  // ③ 提问
  text('甲午 · 戊戌 · 辛亥', 540, TOP, { size: 66, weight: 900, alpha: win(t, 16.4, 19.2), spacing: 6 });
  caption(t, 16.4, 19.2, '甲午战争、戊戌变法、辛亥革命，|这些名字，是哪来的？', 'The Jiawu War, the Wuxu Reform, the Xinhai Revolution: where do the names come from?');

  // ④ 揭晓：就是那一年的干支
  [[19.4, 23.6, '1894', '甲午', '战争'], [23.6, 27.2, '1898', '戊戌', '变法'], [27.2, 31.4, '1911', '辛亥', '革命']].forEach(([a, b, y, g, e]) =>
    richText([[y + '  ', MUTE], [g, RED], [e, INK]], 540, TOP, { size: 68, weight: 900, alpha: win(t, a + .6, b, .3), spacing: 4 }));
  caption(t, 19.2, 23.6, '就是那一年的干支：|1894 年是甲午年，所以叫甲午战争。', 'They are the years\' names: 1894 was a Jiawu year.');
  caption(t, 23.6, 27.2, '1898 年，戊戌年，|戊戌变法。', '1898, a Wuxu year: the Wuxu Reform.');
  caption(t, 27.2, 31.4, '1911 年，辛亥年，|辛亥革命。', '1911, a Xinhai year: the Xinhai Revolution.');

  // ⑤ 小窍门：年份尾数就是天干
  const ya = win(t, 31.2, 36.4);
  if (ya > 0) {
    [4, 5, 6, 7, 8, 9, 0, 1, 2, 3].forEach((d, i) => {
      const x = 540 + (i % 5 - 2) * 150, y = 560 + Math.floor(i / 5) * 200, a = ya * prog(t, 31.4 + i * .1, 31.9 + i * .1);
      const hot = d === 4 || d === 8 || d === 1;
      text(String(d), x, y, { size: 58, weight: 700, color: hot ? INK : MUTE, alpha: a });
      text(GAN[i], x, y + 78, { size: 60, weight: 900, color: hot ? RED : INK, alpha: a });
    });
  }
  text('年份最后一位 = 天干', 540, TOP, { size: 56, weight: 900, alpha: win(t, 31.4, 36.4), spacing: 4 });
  caption(t, 31.4, 36.4, '小窍门：年份最后一位，就是天干。|4 是甲，8 是戊，1 是辛。', 'Trick: the last digit of the year gives the stem.');

  // ⑥ 六十年一甲子，花甲
  text('60 年', 540, TOP, { size: 90, weight: 900, color: RED, alpha: win(t, 36.6, 42.4) });
  caption(t, 36.4, 42.4, '十个天干、十二个地支一起转，|转满一圈，正好六十年。', 'Ten stems and twelve branches turn together: sixty years per cycle.');
  richText([['1966 ', MUTE], ['丙午', RED], ['  →  ', INK], ['2026 ', MUTE], ['丙午', RED]], 540, TOP, { size: 56, weight: 900, alpha: win(t, 42.6, 47.6) });
  caption(t, 42.4, 47.6, '所以叫「六十年一甲子」。活到六十岁，|正好转完一圈，叫「花甲」。', 'That is why turning sixty is called completing a cycle.');

  // ⑦ 收尾
  const ea = prog(t, 47.6, 48.4);
  text('六十甲子', 500, TOP - 30, { size: 80, weight: 900, alpha: ea, spacing: 12 });
  seal('花甲', 770, TOP - 36, 60, prog(t, 48.2, 48.8));
  caption(t, 47.8, 53.2, '你属什么？今年是你的本命年吗？|评论区说说。', 'What is your animal? Is this your year? Tell us below.');
};

// 节奏：开头稍放慢；提问停住倒数 5 秒（倒数圈放在转盘下方）
scene(render, [
  [0, 12.4, .9],
  [12.4, 18.4], ['count', 5, 540, 1088],
  [18.4, 53.2],
]);
</script>
</body></html>
