<!doctype html>
<html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;900&display=swap');
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 画面：render(t) 按时间画一帧；所有动画都由时间和每段 BPM 推出来，保证和配乐卡点一致
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = "'Noto Sans SC','WenQuanYi Zen Hei',sans-serif";
let SCENES = [];
window.setTimeline = (scenes) => {
  let t = 0;
  SCENES = scenes.map(s => { const d = s.beats * 60 / s.bpm; const o = { ...s, start: t, dur: d, beat: 60 / s.bpm }; t += d; return o; });
  return t;
};
const GENRES = () => SCENES.filter(s => s.name);

// ---------- 工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const backOut = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function font(px, w = 900) { ctx.font = `${w} ${px}px ${FONT}`; }
function text(s, x, y, px, color, { w = 900, align = 'center', alpha = 1, stroke = null, sw = 0, ls = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; font(px, w); ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (ls) ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- 篮球 / 篮筐 ----------
function ball(x, y, r = 58, rot = 0, sq = 0, color = '#F26B1D') {
  ctx.save(); ctx.translate(x, y);
  // 影子
  ctx.save(); ctx.globalAlpha = 0.25 * clamp(1 - (1300 - y) / 600); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 1300 - y + r * 0.1 + 8, r * 1.1, r * 0.25, 0, 0, 7); ctx.fill(); ctx.restore();
  ctx.scale(1 + sq, 1 - sq); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r);
  g.addColorStop(0, '#FFB070'); g.addColorStop(.6, color); g.addColorStop(1, '#9A3A08');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2A1205'; ctx.lineWidth = r * 0.07;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.moveTo(0, -r); ctx.lineTo(0, r); ctx.stroke();
  ctx.beginPath(); ctx.arc(-r * 1.25, 0, r * 0.85, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * 1.25, 0, r * 0.85, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.restore();
}
const RIM = { x: 790, y: 880, w: 150 };
function hoop(dark, wobble = 0) {
  const line = dark ? '#3B2A12' : 'rgba(255,255,255,.92)';
  // 篮板
  ctx.save(); ctx.fillStyle = dark ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.14)'; ctx.strokeStyle = line; ctx.lineWidth = 8;
  rrect(RIM.x + RIM.w / 2 + 10, 640, 22, 300, 6); ctx.fill(); ctx.stroke();
  // 网
  ctx.lineWidth = 4; ctx.strokeStyle = dark ? 'rgba(59,42,18,.7)' : 'rgba(255,255,255,.7)';
  for (let i = 0; i <= 6; i++) {
    const x0 = RIM.x - RIM.w / 2 + i * RIM.w / 6, x1 = RIM.x - RIM.w / 3 + i * RIM.w / 9 + Math.sin(wobble * 3 + i) * wobble * 14;
    ctx.beginPath(); ctx.moveTo(x0, RIM.y); ctx.lineTo(x1, RIM.y + 130 + wobble * 20); ctx.stroke();
  }
  for (let j = 1; j <= 3; j++) {
    const yy = RIM.y + j * 38 + wobble * 6 * j, sh = j * 10;
    ctx.beginPath(); ctx.moveTo(RIM.x - RIM.w / 2 + sh, yy); ctx.lineTo(RIM.x + RIM.w / 2 - sh, yy); ctx.stroke();
  }
  // 筐
  ctx.strokeStyle = '#E8471B'; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.ellipse(RIM.x, RIM.y, RIM.w / 2, 16, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(RIM.x + RIM.w / 2, RIM.y); ctx.lineTo(RIM.x + RIM.w / 2 + 12, RIM.y - 8); ctx.stroke();
  ctx.restore();
}
function court(dark) {
  ctx.save(); ctx.strokeStyle = dark ? 'rgba(80,55,20,.25)' : 'rgba(255,255,255,.12)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, 1330); ctx.lineTo(W, 1330); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, 1330, 420, 70, 0, Math.PI, 0); ctx.stroke();
  ctx.restore();
}
// 抛物线
function arcPos(p0, p1, h, k) { return { x: lerp(p0.x, p1.x, k), y: lerp(p0.y, p1.y, k) - h * 4 * k * (1 - k) }; }
const FLOOR = 1300 - 58;

// ---------- 各曲风的篮球动作 ----------
const ACT = {
  // 说唱：胯下/体前变向，每拍一次，左右换手
  hiphop(u, b, S) {
    const bt = u / b, i = Math.floor(bt), k = bt - i;
    const side = i % 2 ? 1 : -1;
    const x = W / 2 + lerp(-side, side, easeInOut(k)) * 230;
    const yy = FLOOR - 330 * (1 - Math.abs(Math.sin(Math.PI * (k + 0.5))));
    const sq = Math.max(0, 0.18 - Math.abs(k - 0.5) * 1.2);
    // 残影
    for (let g = 3; g >= 1; g--) {
      const kk = clamp(k - g * 0.05), xg = W / 2 + lerp(-side, side, easeInOut(kk)) * 230, yg = FLOOR - 330 * (1 - Math.abs(Math.sin(Math.PI * (kk + .5))));
      ctx.globalAlpha = 0.12 * (4 - g); ball(xg, yg, 58, 0); ctx.globalAlpha = 1;
    }
    ball(x, yy, 58, bt * 2, sq);
    if (k < 0.35) text(['咚', '次', '哒', '次'][i % 4], x, FLOOR - 200, 90, S.accent, { alpha: 1 - k / 0.35, stroke: '#000', sw: 10 });
  },
  // 爵士：节奏不固定，停顿 → 突然加速；字幕“? ? ?”
  jazz(u, b, S) {
    const keys = [[0, 380], [0.6, 380], [1.0, 640], [2.6, 640], [2.8, 300], [3.1, 760], [5.2, 760], [5.5, 380], [6.6, 380], [7.0, 700], [9.4, 700], [9.7, 420], [12, 420]];
    const bt = u / b;
    let x = 380;
    for (let j = 0; j < keys.length - 1; j++) if (bt >= keys[j][0] && bt <= keys[j + 1][0]) x = lerp(keys[j][1], keys[j + 1][1], easeInOut((bt - keys[j][0]) / (keys[j + 1][0] - keys[j][0])));
    const moving = keys.some((kk, j) => j < keys.length - 1 && bt >= kk[0] && bt < keys[j + 1][0] && kk[1] !== keys[j + 1][1]);
    // 运球节奏：停顿时慢拍，移动时快拍
    const rate = moving ? 2 : 0.66, ph = (bt * rate) % 1;
    const y = FLOOR - (moving ? 220 : 380) * (1 - Math.abs(Math.sin(Math.PI * (ph + .5))));
    ball(x, y, 58, x / 60, Math.max(0, 0.15 - Math.abs(ph - .5) * 1.0));
    // 防守人（虚线圈）被晃
    const dx = lerp(x, 560, 0.55) + Math.sin(bt * 1.3) * 40;
    ctx.save(); ctx.setLineDash([18, 14]); ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(dx + (moving ? -60 : 0), FLOOR - 120, 70, 170, moving ? -0.25 : 0, 0, 7); ctx.stroke(); ctx.restore();
    text('防守人', dx + (moving ? -60 : 0), FLOOR - 120, 34, 'rgba(255,255,255,.6)', { w: 500 });
    if (!moving) text('…', x, FLOOR - 470, 80, S.accent);
    else text('?!', dx - 60, FLOOR - 340, 80, S.accent, { stroke: '#000', sw: 8 });
  },
  // 重金属：每 4 拍一次暴扣，扣下来震屏
  metal(u, b, S) {
    const bar = 4 * b, k = (u % bar) / bar;
    let x, y, sq = 0;
    if (k < 0.6) { const p = arcPos({ x: 220, y: FLOOR }, { x: RIM.x, y: RIM.y - 160 }, 260, easeOut(k / 0.6)); x = p.x; y = p.y; }
    else if (k < 0.7) { const kk = (k - 0.6) / 0.1; x = RIM.x; y = lerp(RIM.y - 160, RIM.y + 140, kk * kk); }
    else { const kk = (k - 0.7) / 0.3; x = RIM.x - kk * 120; y = lerp(RIM.y + 140, FLOOR, Math.min(1, kk * 3)) - (kk > .33 ? 160 * Math.sin(Math.PI * (kk - .33) / .67) : 0); }
    hoop(false, k > 0.62 && k < 0.85 ? (0.85 - k) * 5 : 0);
    ball(x, y, 62, u * 6, sq, '#E0531A');
    if (k > 0.62 && k < 0.9) text('砰！', RIM.x - 260, RIM.y - 60, 170, S.accent, { stroke: '#000', sw: 14, alpha: 1 - (k - 0.62) / 0.28 });
    return true;
  },
  // R&B：慢节奏、丝滑的中投，带拖尾
  rnb(u, b, S) {
    const per = 2 * b, k = (u % per) / per;
    const p0 = { x: 240, y: 1020 }, p1 = { x: RIM.x, y: RIM.y - 10 };
    const kk = easeInOut(clamp(k / 0.8));
    ctx.save(); ctx.setLineDash([4, 22]); ctx.lineCap = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); for (let s = 0; s <= kk; s += 0.02) { const p = arcPos(p0, p1, 420, s); s ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.stroke(); ctx.restore();
    hoop(false, k > 0.8 ? (1 - k) * 4 : 0);
    let p = k < 0.8 ? arcPos(p0, p1, 420, kk) : { x: RIM.x, y: RIM.y + (k - 0.8) / 0.2 * 200 };
    ball(p.x, p.y, 54, u * 2);
    if (k > 0.8) text('唰～', RIM.x - 230, RIM.y + 40, 110, S.accent, { stroke: 'rgba(0,0,0,.4)', sw: 8, alpha: 1 - (k - .8) / .2 });
    return true;
  },
  // 古典：标准打板，画辅助线（教科书感）
  classical(u, b, S) {
    const per = 3 * b, k = (u % per) / per;
    const p0 = { x: 260, y: 1080 }, bank = { x: RIM.x + RIM.w / 2 - 20, y: 760 }, p2 = { x: RIM.x, y: RIM.y };
    ctx.save(); ctx.setLineDash([16, 14]); ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(80,55,20,.5)';
    ctx.beginPath(); for (let s = 0; s <= 1; s += 0.02) { const p = arcPos(p0, bank, 140, s); s ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); } ctx.lineTo(p2.x, p2.y); ctx.stroke();
    // 打板点 + 角度标注
    ctx.setLineDash([]); ctx.fillStyle = '#8B5E1A'; ctx.beginPath(); ctx.arc(bank.x + 20, bank.y, 12, 0, 7); ctx.fill();
    ctx.restore();
    text('45°', bank.x - 110, bank.y + 10, 54, '#8B5E1A', { w: 500 });
    text('打板点', bank.x - 30, bank.y - 70, 38, '#8B5E1A', { w: 500 });
    hoop(true, k > 0.85 ? (1 - k) * 4 : 0);
    let p;
    if (k < 0.65) p = arcPos(p0, bank, 140, easeInOut(k / 0.65));
    else if (k < 0.85) { const kk = (k - .65) / .2; p = { x: lerp(bank.x, p2.x, kk), y: lerp(bank.y, p2.y, kk * kk) }; }
    else p = { x: p2.x, y: p2.y + (k - .85) / .15 * 180 };
    ball(p.x, p.y, 54, u * 1.5);
    return true;
  },
  // 民谣：别人投篮不进，他默默抢下篮板，篮板 +1
  folk(u, b, S) {
    const per = 4 * b, i = Math.floor(u / per), k = (u % per) / per;
    hoop(false, k > 0.4 && k < 0.6 ? 0.5 : 0);
    let p;
    if (k < 0.4) p = arcPos({ x: 200, y: 1000 }, { x: RIM.x - RIM.w / 2, y: RIM.y - 30 }, 230, easeInOut(k / 0.4));
    else if (k < 0.75) p = arcPos({ x: RIM.x - RIM.w / 2, y: RIM.y - 30 }, { x: 420, y: 960 }, 110, (k - 0.4) / 0.35);
    else p = { x: 420, y: 960 };
    // 他（简笔头像圈）
    const up = k > 0.6 && k < 0.8 ? Math.sin(Math.PI * (k - .6) / .2) * 80 : 0;
    ctx.save(); ctx.fillStyle = 'rgba(242,227,179,.9)'; ctx.beginPath(); ctx.arc(420, 1080 - up, 60, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(242,227,179,.9)'; ctx.lineWidth = 22; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(420, 1140 - up); ctx.lineTo(420, 1260 - up * .5); ctx.moveTo(420, 1160 - up); ctx.lineTo(330, 1060 - up); ctx.moveTo(420, 1160 - up); ctx.lineTo(510, 1060 - up); ctx.stroke(); ctx.restore();
    ball(p.x, p.y, 54, u * 2);
    if (k > 0.4 && k < 0.55) text('打铁', RIM.x - 40, RIM.y - 130, 80, '#fff', { stroke: '#000', sw: 8 });
    const n = i + (k > 0.75 ? 1 : 0);
    text(`篮板 +${n}`, 420, 820, 74, S.accent, { stroke: 'rgba(0,0,0,.5)', sw: 8, alpha: n ? 1 : 0 });
    return true;
  },
  // 广场舞：动次打次，球跟着四四拍蹦，彩灯
  square(u, b, S) {
    const bt = u / b, k = bt % 1;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const cols = ['#FF3B3B', '#FFD400', '#22D3EE', '#A3E635', '#F472B6'];
    for (let j = 0; j < 5; j++) {
      const a = Math.sin(u * 2 + j * 1.3) * 0.6;
      ctx.save(); ctx.translate(W / 2, 560); ctx.rotate(a); ctx.globalAlpha = 0.16;
      ctx.fillStyle = cols[j]; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-120, 900); ctx.lineTo(120, 900); ctx.fill(); ctx.restore();
    }
    ctx.restore();
    const y = FLOOR - 300 * (1 - Math.abs(Math.sin(Math.PI * (k + .5))));
    const c = cols[Math.floor(bt) % 5];
    ball(W / 2, y, 64, 0, Math.max(0, 0.22 - Math.abs(k - .5) * 1.4) * (k < .5 ? 1 : 1), Math.floor(bt) % 2 ? '#F26B1D' : '#F59E0B');
    text(['动', '次', '打', '次'][Math.floor(bt) % 4], W / 2 + (Math.floor(bt) % 2 ? 260 : -260), FLOOR - 200, 120, c, { stroke: '#000', sw: 10, alpha: 1 - k });
  },
};

// ---------- 场景 ----------
function bgFill(c0, c1, dark) {
  const g = ctx.createLinearGradient(0, 0, W * .3, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function header(dark, ep = true) {
  const col = dark ? '#3B2A12' : '#fff';
  ctx.save(); ctx.fillStyle = dark ? '#3B2A12' : '#fff'; rrect(60, 92, 150, 70, 35); ctx.fill(); ctx.restore();
  text('EP.1', 135, 128, 38, dark ? '#F4EEDF' : '#111');
  text('如果球风是一种曲风', 240, 128, 46, col, { align: 'left' });
}
function progress(idx, dark) {
  const gs = GENRES(), n = gs.length, w = 110, gap = 18, x0 = (W - (n * w + (n - 1) * gap)) / 2;
  gs.forEach((g, j) => {
    ctx.save(); ctx.fillStyle = j === idx ? (dark ? '#3B2A12' : '#fff') : (dark ? 'rgba(59,42,18,.25)' : 'rgba(255,255,255,.25)');
    rrect(x0 + j * (w + gap), 1830, w, 12, 6); ctx.fill(); ctx.restore();
  });
}

function drawGenre(S, u, idx) {
  const dark = !!S.dark, ink = dark ? '#2B1D0A' : '#fff';
  bgFill(S.bg[0], S.bg[1], dark);
  // 震屏（重金属在扣篮瞬间）
  let shake = 0;
  if (S.id === 'metal') { const k = (u % (4 * S.beat)) / (4 * S.beat); if (k > .6 && k < .8) shake = (0.8 - k) * 160; }
  ctx.save(); ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  court(dark);
  header(dark);
  // 曲风大字：砸进来
  const kin = backOut(u / 0.35), sc = lerp(2.2, 1, kin);
  const pulse = 1 + 0.035 * Math.pow(1 - ((u / S.beat) % 1), 3);
  ctx.save(); ctx.translate(W / 2, 360); ctx.scale(sc * pulse, sc * pulse); ctx.globalAlpha = clamp(u / 0.12);
  text('曲风', 0, -110, 52, S.accent, { w: 500, ls: 12 });
  const big = S.name.length > 3 ? 168 : 240;
  text(S.name, 0, 40, big, ink, { stroke: dark ? 'rgba(0,0,0,0)' : 'rgba(0,0,0,.25)', sw: 16 });
  ctx.restore();
  text(S.en, W / 2, 560, 46, S.accent, { w: 500, ls: 14, alpha: clamp((u - .2) / .3) });

  // 动作区
  ACT[S.id](u, S.beat, S);

  // 代表球星：滑入
  const ks = easeOut((u - 0.5) / 0.4);
  ctx.save(); ctx.globalAlpha = ks; ctx.translate(lerp(-300, 0, ks), 0);
  const label = `代表球星  ${S.star}`; font(56); const tw = ctx.measureText(label).width + 90;
  ctx.fillStyle = S.accent; rrect(W / 2 - tw / 2, 1395, tw, 104, 52); ctx.fill();
  text(label, W / 2, 1448, 56, dark ? '#F4EEDF' : '#111');
  ctx.restore();

  // 一句话
  const kl = easeOut((u - 1.0) / 0.4);
  ctx.save(); ctx.globalAlpha = kl; ctx.translate(0, lerp(40, 0, kl));
  ctx.fillStyle = dark ? 'rgba(59,42,18,.92)' : 'rgba(255,255,255,.95)'; rrect(80, 1540, W - 160, 240, 36); ctx.fill();
  S.line.split('\n').forEach((ln, j) => text(ln, W / 2, 1610 + j * 100, 62, dark ? '#F4EEDF' : '#111'));
  ctx.restore();
  progress(idx, dark);
  ctx.restore();
  // 换段闪白
  if (u < 0.15) { ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - u / 0.15)})`; ctx.fillRect(0, 0, W, H); }
}

function drawIntro(S, u) {
  bgFill('#0E0E10', '#26262B');
  court(false);
  const lines = [['打球这么多年', 0.15, 80, '#fff'], ['我发现', 0.9, 80, '#fff'], ['每个人的球风', 1.6, 96, '#fff'], ['都有自己的曲风', 2.3, 120, '#FACC15']];
  lines.forEach(([s, at, px, c], j) => {
    const k = backOut((u - at) / 0.3);
    if (u < at) return;
    ctx.save(); ctx.translate(W / 2, 360 + j * 170); ctx.scale(lerp(1.6, 1, k), lerp(1.6, 1, k));
    text(s, 0, 0, px, c, { alpha: clamp((u - at) / .12) }); ctx.restore();
  });
  // 慢慢运球，越来越快
  const ph = Math.pow(u / S.dur, 1.6) * 7, k = ph % 1;
  ball(W / 2, FLOOR - 260 * (1 - Math.abs(Math.sin(Math.PI * (k + .5)))), 64, u * 2);
  text('你是哪一种？', W / 2, 1640, 64, 'rgba(255,255,255,.7)', { w: 500, alpha: clamp((u - 2.8) / .3) });
}

function drawOutro(S, u) {
  bgFill('#0E0E10', '#1F1F25');
  const b = S.beat, bt = u / b;
  const k0 = backOut(u / .35);
  ctx.save(); ctx.translate(W / 2, 330); ctx.scale(lerp(2, 1, k0), lerp(2, 1, k0));
  text('你是哪一种？', 0, 0, 130, '#FACC15'); ctx.restore();
  // 7 个曲风小卡，跟着拍子依次点亮
  const gs = GENRES(), cw = 440, ch = 170, gx = 40, gy = 34, x0 = (W - (2 * cw + gx)) / 2, y0 = 520;
  gs.forEach((g, j) => {
    const col = j % 2, row = Math.floor(j / 2);
    const x = j === gs.length - 1 && gs.length % 2 ? W / 2 - cw / 2 : x0 + col * (cw + gx), y = y0 + row * (ch + gy);
    const appear = easeOut((u - 0.2 - j * 0.12) / 0.3);
    const lit = Math.floor(bt) % gs.length === j && bt < 8;
    ctx.save(); ctx.globalAlpha = appear; ctx.translate(x + cw / 2, y + ch / 2); const s = lit ? 1.07 : 1; ctx.scale(s, s);
    const g2 = ctx.createLinearGradient(-cw / 2, 0, cw / 2, 0); g2.addColorStop(0, g.bg[0]); g2.addColorStop(1, g.bg[1]);
    ctx.fillStyle = g2; rrect(-cw / 2, -ch / 2, cw, ch, 30); ctx.fill();
    if (lit) { ctx.lineWidth = 8; ctx.strokeStyle = '#FACC15'; ctx.stroke(); }
    text(g.name, 0, -18, g.name.length > 3 ? 56 : 68, g.dark ? '#2B1D0A' : '#fff');
    text(g.star, 0, 50, 36, g.dark ? '#5B4320' : g.accent, { w: 500 });
    ctx.restore();
  });
  const ka = easeOut((u - 2.0) / .4);
  text('评论区报上你的曲风 ↓', W / 2, 1420, 70, '#fff', { alpha: ka });
  text('也可以 @ 你的队友，看他是哪种', W / 2, 1520, 46, 'rgba(255,255,255,.65)', { w: 500, alpha: ka });
  const kn = easeOut((u - 3.0) / .4);
  ctx.save(); ctx.globalAlpha = kn; ctx.fillStyle = '#FACC15'; rrect(170, 1640, W - 340, 110, 55); ctx.fill(); ctx.restore();
  text('下期：如果球风是一位歌手', W / 2, 1695, 54, '#111', { alpha: kn });
  if (u < 0.15) { ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - u / 0.15)})`; ctx.fillRect(0, 0, W, H); }
  if (u > S.dur - 0.5) { ctx.fillStyle = `rgba(0,0,0,${(u - (S.dur - .5)) / .5})`; ctx.fillRect(0, 0, W, H); }
}

window.render = (t) => {
  ctx.clearRect(0, 0, W, H);
  const i = SCENES.findIndex(s => t >= s.start && t < s.start + s.dur);
  const S = SCENES[i < 0 ? SCENES.length - 1 : i], u = t - S.start;
  if (S.id === 'intro') drawIntro(S, u);
  else if (S.id === 'outro') drawOutro(S, u);
  else drawGenre(S, u, GENRES().indexOf(S));
};
window.frame = (t) => { window.render(t); return cv.toDataURL('image/jpeg', 0.92); };
</script></body></html>
